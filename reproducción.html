<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reproductor PRO</title>
<style>
:root {
  --bg: #121212;
  --card: #181818;
  --text: #fff;
  --muted: #b3b3b3;
  --accent: #1db954;
}

body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg);
  color: var(--text);
  margin: 0;
  padding: 20px;
  min-height: 100vh;
}

#player {
  background: rgba(24,24,24,0.8);
  backdrop-filter: blur(20px);
  padding: 25px;
  border-radius: 20px;
  max-width: 420px;
  margin: 0 auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  border: 1px solid rgba(255,255,255,0.1);
}

#cover {
  width: 280px;
  height: 280px;
  margin: 0 auto 25px;
  border-radius: 12px;
  background: linear-gradient(135deg, #1db954, #1ed760);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 80px;
  overflow: hidden;
  box-shadow: 0 15px 40px rgba(0,0,0,0.4);
  transition: transform 0.3s;
}

#cover.playing {
  animation: pulse 2s ease-in-out infinite;
}

@keyframes pulse {
 0%, 100% { transform: scale(1); }
 50% { transform: scale(1.02); }
}

.top-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 15px;
}

#songCount { color: var(--muted); font-size: 14px; }

input[type="file"] {
  width: 100%;
  margin-bottom: 15px;
  padding: 10px;
  background: rgba(255,255,255,0.05);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 10px;
  color: var(--muted);
  cursor: pointer;
}

#nowPlaying {
  text-align: center;
  margin: 15px 0 5px;
  font-weight: 700;
  font-size: 18px;
  white-space: nowrap;
  overflow: hidden;
}

#nowPlaying.scroll {
  animation: scroll-text 8s linear infinite;
}

@keyframes scroll-text {
 0% { transform: translateX(100%); }
 100% { transform: translateX(-100%); }
}

#artist {
  text-align: center;
  color: var(--muted);
  font-size: 14px;
  margin-bottom: 20px;
}

#visualizer {
  width: 100%;
  height: 60px;
  margin: 15px 0;
  display: block;
}

.time {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--muted);
  margin-top: 8px;
}

#progress {
  width: 100%;
  height: 6px;
  -webkit-appearance: none;
  background: rgba(255,255,255,0.1);
  border-radius: 3px;
  outline: none;
  cursor: pointer;
  box-shadow: 0 0 10px var(--accent);
}

#progress::-webkit-slider-thumb {
  -webkit-appearance: none;
  width: 14px;
  height: 14px;
  background: var(--accent);
  border-radius: 50%;
  cursor: pointer;
  box-shadow: 0 0 15px var(--accent);
}

.controls {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 20px;
  margin: 25px 0;
}

button {
  background: rgba(255,255,255,0.1);
  backdrop-filter: blur(10px);
  border: none;
  color: var(--muted);
  font-size: 22px;
  cursor: pointer;
  padding: 12px;
  border-radius: 50%;
  transition: all 0.3s;
}

button:hover {
  transform: scale(1.15);
  background: rgba(255,255,255,0.15);
}
button.active {
  color: var(--accent);
  background: rgba(29,185,84,0.2);
}

#playBtn {
  background: var(--accent);
  color: var(--bg);
  width: 60px;
  height: 60px;
  font-size: 26px;
  box-shadow: 0 0 25px var(--accent);
}

#playBtn:hover {
  box-shadow: 0 0 35px var(--accent);
  transform: scale(1.1);
}

.sort-bar {
  display: flex;
  gap: 10px;
  margin-bottom: 15px;
  font-size: 13px;
}

.sort-bar button {
  font-size: 13px;
  padding: 6px 12px;
  border-radius: 20px;
}

#playlist {
  list-style: none;
  padding: 0;
  max-height: 200px;
  overflow-y: auto;
}

#playlist li {
  padding: 12px 35px 12px 15px;
  background: rgba(255,255,255,0.05);
  border: 1px solid transparent;
  margin: 6px 0;
  border-radius: 8px;
  cursor: pointer;
  position: relative;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  transition: all 0.3s;
}

#playlist li:hover {
  background: rgba(255,255,255,0.1);
  transform: translateX(5px);
}
#playlist li.active {
  background: rgba(29,185,84,0.2);
  color: var(--accent);
  font-weight: bold;
  border-color: var(--accent);
}

#playlist li.del {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: #f55;
  font-size: 18px;
}

.empty-msg {
  text-align: center;
  color: var(--muted);
  padding: 20px;
  font-size: 14px;
}
</style>
</head>
<body>
<div id="player">
  <div class="top-bar">
    <div id="songCount">Cargando...</div>
  </div>

  <input type="file" id="fileInput" accept="audio/*" multiple>

  <div id="cover">🎵</div>

  <audio id="audio" preload="metadata"></audio>

  <div id="nowPlaying">Toca una canción para empezar</div>
  <div id="artist">-</div>

  <canvas id="visualizer"></canvas>

  <input type="range" id="progress" value="0" max="100">
  <div class="time">
    <span id="currentTime">0:00</span>
    <span id="duration">-0:00</span>
  </div>

  <div class="controls">
    <button onclick="toggleShuffle()" id="shuffleBtn">🔀</button>
    <button onclick="prevSong()">⏮️</button>
    <button onclick="togglePlay()" id="playBtn">▶️</button>
    <button onclick="nextSong()">⏭️</button>
    <button onclick="toggleRepeat()" id="repeatBtn">🔁</button>
  </div>

  <div class="sort-bar">
    <button onclick="sortSongs('name')">A-Z</button>
    <button onclick="sortSongs('date')">Recientes</button>
  </div>

  <ul id="playlist"></ul>
</div>

<script>
let audio = document.getElementById('audio');
let playlist = [];
let currentIndex = 0;
let db;
let isShuffle = false;
let repeatMode = 0;

// Audio Context para visualizador
let audioContext, analyser, dataArray;
let canvas = document.getElementById('visualizer');
let ctx = canvas.getContext('2d');
canvas.width = 400;
canvas.height = 60;

function initAudioContext() {
  if (!audioContext) {
    audioContext = new (window.AudioContext || window.webkitAudioContext)();
    analyser = audioContext.createAnalyser();
    analyser.fftSize = 64;
    dataArray = new Uint8Array(analyser.frequencyBinCount);
    let source = audioContext.createMediaElementSource(audio);
    source.connect(analyser);
    analyser.connect(audioContext.destination);
  }
}

function drawVisualizer() {
  if (!analyser) return;
  requestAnimationFrame(drawVisualizer);
  analyser.getByteFrequencyData(dataArray);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let barWidth = canvas.width / dataArray.length;
  for (let i = 0; i < dataArray.length; i++) {
    let barHeight = (dataArray[i] / 255) * canvas.height;
    ctx.fillStyle = `hsl(${120 + i * 3}, 70%, 50%)`;
    ctx.fillRect(i * barWidth, canvas.height - barHeight, barWidth - 2, barHeight);
  }
}

// Base de datos
let request = indexedDB.open('MusicDB', 3);
request.onupgradeneeded = e => {
  db = e.target.result;
  if (!db.objectStoreNames.contains('songs')) {
    db.createObjectStore('songs', {keyPath: 'id', autoIncrement: true});
  }
};
request.onsuccess = e => {
  db = e.target.result;
  loadSongs();
};

document.getElementById('fileInput').onchange = e => {
  let files = e.target.files;
  for (let file of files) {
    let tx = db.transaction('songs', 'readwrite');
    tx.objectStore('songs').add({name: file.name, file: file, date: Date.now()});
    tx.oncomplete = loadSongs;
  }
};

function loadSongs() {
  let tx = db.transaction('songs', 'readonly');
  let req = tx.objectStore('songs').getAll();
  req.onsuccess = () => {
    playlist = req.result;
    updateSongCount();
    renderPlaylist();
  };
}

function updateSongCount() {
  document.getElementById('songCount').textContent =
    playlist.length === 0? 'No hay canciones' :
    `${playlist.length} canción${playlist.length > 1? 'es' : ''}`;
}

function renderPlaylist() {
  let ul = document.getElementById('playlist');
  ul.innerHTML = '';
  if (playlist.length === 0) {
    ul.innerHTML = '<li class="empty-msg">Agrega canciones con el botón de arriba</li>';
    return;
  }
  playlist.forEach((song, i) => {
    let li = document.createElement('li');
    li.innerHTML = song.name + `<span class="del" onclick="deleteSong(${song.id}, event)">✕</span>`;
    li.onclick = () => playSong(i);
    if (i === currentIndex) li.classList.add('active');
    ul.appendChild(li);
  });
}

function playSong(index) {
  currentIndex = index;
  let song = playlist[index];
  let url = URL.createObjectURL(song.file);
  audio.src = url;

  let cleanName = song.name.replace(/\.[^/.]+$/, "");
  document.getElementById('nowPlaying').textContent = cleanName;
  document.getElementById('artist').textContent = 'Artista desconocido';

  audio.load();
  initAudioContext();

  audio.play().then(() => {
    document.getElementById('cover').classList.add('playing');
    if (audioContext) audioContext.resume();
    drawVisualizer();
  }).catch(err => console.log(err));

  document.getElementById('playBtn').textContent = '⏸️';
  renderPlaylist();

  let titleEl = document.getElementById('nowPlaying');
  if (cleanName.length > 25) {
    titleEl.classList.add('scroll');
  } else {
    titleEl.classList.remove('scroll');
  }
}

function togglePlay() {
  if (audio.paused) {
    audio.play();
    document.getElementById('playBtn').textContent = '⏸️';
    document.getElementById('cover').classList.add('playing');
    if (audioContext) audioContext.resume();
  } else {
    audio.pause();
    document.getElementById('playBtn').textContent = '▶️';
    document.getElementById('cover').classList.remove('playing');
  }
}

function nextSong() {
  if (repeatMode === 2) {
    audio.currentTime = 0;
    audio.play();
    return;
  }
  if (isShuffle) {
    currentIndex = Math.floor(Math.random() * playlist.length);
  } else {
    currentIndex = (currentIndex + 1) % playlist.length;
  }
  playSong(currentIndex);
}

function prevSong() {
  if (audio.currentTime > 3) {
    audio.currentTime = 0;
    return;
  }
  currentIndex = (currentIndex - 1 + playlist.length) % playlist.length;
  playSong(currentIndex);
}

function toggleShuffle() {
  isShuffle =!isShuffle;
  document.getElementById('shuffleBtn').classList.toggle('active');
}

function toggleRepeat() {
  repeatMode = (repeatMode + 1) % 3;
  let btn = document.getElementById('repeatBtn');
  btn.classList.toggle('active', repeatMode > 0);
  btn.textContent = repeatMode === 2? '🔂' : '🔁';
}

function deleteSong(id, event) {
  event.stopPropagation();
  let tx = db.transaction('songs', 'readwrite');
  tx.objectStore('songs').delete(id);
  tx.oncomplete = loadSongs;
}

function sortSongs(type) {
  if (type === 'name') {
    playlist.sort((a, b) => a.name.localeCompare(b.name));
  } else {
    playlist.sort((a, b) => b.date - a.date);
  }
  renderPlaylist();
}

function formatTime(s) {
  let m = Math.floor(s / 60);
  let sec = Math.floor(s % 60);
  return `${m}:${sec.toString().padStart(2, '0')}`;
}

audio.ontimeupdate = () => {
  if (audio.duration) {
    document.getElementById('progress').value = (audio.currentTime / audio.duration) * 100;
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    let remaining = audio.duration - audio.currentTime;
    document.getElementById('duration').textContent = `-${formatTime(remaining)}`;
  }
};

document.getElementById('progress').oninput = e => {
  audio.currentTime = (e.target.value / 100) * audio.duration;
};

audio.onended = nextSong;
</script>
</body>
</html>
